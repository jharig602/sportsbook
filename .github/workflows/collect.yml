name: collect

# Cadence is shaped by two constraints, not by taste:
#
# 1. Football lines move on a weekly rhythm. NCAAF prices barely exist 13 days out
#    (6% of games priced) and reach ~59% at six days, so weekday polling is mostly
#    watching nothing happen.
# 2. A private repo gets 2,000 free Actions minutes a month. At roughly 90 seconds a
#    run, polling every 30 minutes all week would cost ~2,900 and stop mid-month.
#
# So: light on Mon-Thu, every 30 minutes Fri-Sun when the money actually moves.
# That lands near 760 runs/month (~1,150 minutes) with headroom.
#
# To poll harder, make the repository public — public repos get unlimited Actions
# minutes, and nothing here is secret (credentials live in Actions secrets, and
# .gitignore keeps collected data out of the repo).

# GitHub cron is UTC, and the offset matters here. UTC Friday 00:00 is Thursday 8pm ET,
# so the dense window opens in time for Thursday Night Football. UTC Monday 00:00 is
# Sunday 8pm ET — which would have ended the dense window twenty minutes before Sunday
# Night Football kicks off, losing 30-minute coverage in the hours lines move most. The
# Monday 00:00-05:59 UTC block below covers that (Sun 8pm - 2am ET, and 7pm - 1am under
# EST once the clocks change).
# Budget: a run takes about 3 minutes, and a private repo gets 2,000 free Actions
# minutes a month. Polling every 30 minutes around the clock all weekend costs ~2,340
# and would stop mid-month. The saving comes from *when*, not how often: nothing is
# polled between 2am and 8am ET on weekend nights, because there are no games and the
# book is not repricing. That is 520 minutes a month for no lost coverage.
#
# Every window that matters is kept, in ET:
#   Thu 8pm - 2am   Thursday Night Football
#   Fri 8am - 8pm   line movement ahead of the weekend
#   Fri 8pm - 2am   Friday night college games
#   Sat 8am - 2am   the full college slate, day and night
#   Sun 8am - 2am   NFL, including Sunday Night Football
on:
  schedule:
    - cron: "0,30 12-23 * * 5,6,0"   # Fri/Sat/Sun daytime UTC  = 8am-8pm ET
    - cron: "0,30 0-5 * * 5,6,0,1"   # evenings ET (Thu-Sun 8pm-2am), incl. TNF and SNF
    - cron: "0 6-22/4 * * 1,2,3,4"   # Mon-Thu, every 4 hours
  workflow_dispatch:                  # manual trigger, for testing

# One writer at a time. Overlapping runs would interleave inserts into the same
# append-only tables; the collector's design assumes a single writer.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the database URL is present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set. Add it in Settings > Secrets > Actions."
            exit 1
          fi

      # Each league runs separately so one league's failure cannot silently truncate
      # the other's collection. Exit code 3 means "no data" (an empty slate), which is
      # a legitimate outcome midweek and must not fail the run — only 2 (incomplete,
      # i.e. real errors occurred) should.
      - name: Collect NCAAF odds
        run: |
          python collector/odds_poller.py --league ncaaf --days 8 --postgres || \
            { code=$?; [ $code -eq 3 ] && echo "no NCAAF data this window" || exit $code; }

      - name: Collect NFL odds
        run: |
          python collector/odds_poller.py --league nfl --days 8 --postgres || \
            { code=$?; [ $code -eq 3 ] && echo "no NFL data this window" || exit $code; }

      # Cheap (one request per date) and it is what the learning loop grades against.
      # A second book, so the board has something to disagree with. ESPN returns only
      # DraftKings, and a book cannot disagree with itself -- which is why the Edges
      # page correctly reports zero.
      #
      # No cron of its own: the free tier is 500 credits a month and this workflow ticks
      # every 30 minutes in game weeks, so the module decides for itself whether a poll
      # is worth a credit (often near kickoff, rarely midweek) and backs off as the
      # budget runs down. A second schedule would be one more thing to keep in sync, and
      # Actions minutes are nearly spent.
      #
      # Skips cleanly with exit 3 when ODDS_API_KEY is unset, like the notify step.
      - name: Shop other books for a second opinion
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          for league in ncaaf nfl; do
            python collector/shop_lines.py --league $league --postgres ||               { code=$?; [ $code -eq 3 ] && echo "no shop data for $league" || exit $code; }
          done

      - name: Capture final scores
        run: |
          for league in ncaaf nfl; do
            python collector/results.py --league $league --start-date "$(date -u -d '3 days ago' +%F)" \
              --days 4 --postgres || { code=$?; [ $code -eq 3 ] || exit $code; }
          done

      - name: Detect alerts, grade settled games, refit calibration
        run: python collector/pipeline.py --postgres

      # Skipped until APP_URL and ALERT_DISPATCH_SECRET are set, so the workflow is
      # useful before the app is deployed. Never fails the run: a missed notification
      # must not look like a failed collection.
      # Survivor pick popularity. One page a week from survivorgrid.com, whose
      # robots.txt disallows nothing. Cheap, and the only input that can tell a
      # 13-person pool apart from a 137-person one: survival alone says take the
      # biggest favourite, but a pool pays the last entrant standing.
      - name: Fetch survivor pick popularity
        continue-on-error: true
        run: |
          python collector/pick_popularity.py --postgres || {
            code=$?
            [ $code -eq 3 ] && echo 'no popularity data' || exit $code
          }

      # Line-move alerts are still detected and still graded on the Track Record --
      # that is how we learn whether they predict anything. They just no longer buzz.
      # A channel that fires on every unusual line move is one you mute inside a
      # weekend, and a muted channel carries nothing when something real happens.
      - name: Send notifications for cleared-vig offers
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo "APP_URL / ALERT_DISPATCH_SECRET not set; skipping notifications."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$APP_URL/api/dispatch-shop" \
            -H "Authorization: Bearer $DISPATCH_SECRET" \
            || echo "dispatch failed; these alerts stay pending for the next run"

      # Raw response bodies are the only table that grows dangerously against Neon's
      # 0.5 GB free tier. Snapshots, alerts and grades are small and are kept forever.
      # Survivor reminder, Saturday evening and Sunday morning Central.
      #
      # Sent on a schedule rather than on a change, unlike every other alert here,
      # because this is a deadline you can miss rather than an opportunity that
      # appears. "Still the Chargers" is the useful message when deciding whether
      # to look again, and a change-triggered alert cannot say it. The endpoint
      # decides whether the moment qualifies and sends once per window.
      - name: Survivor pick reminder
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo 'survivor reminders not configured'; exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            "$APP_URL/api/dispatch-survivor" \
            -H "Authorization: Bearer $DISPATCH_SECRET"

      - name: Prune raw responses older than 30 days
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'collector')
          import psycopg
          from pg_store import prune_raw_responses
          with psycopg.connect(os.environ['DATABASE_URL']) as connection:
              print('pruned raw responses:', prune_raw_responses(connection, keep_days=30))
          "
