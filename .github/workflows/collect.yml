name: collect

# Cadence is shaped by what actually breaks first, which is not the thing you expect.
#
# Actions minutes are no longer a constraint: the repository is public, so they are
# unlimited. The three real limits, measured:
#
# 1. ESPN. One cycle makes about 195 requests -- the NCAAF odds poller fetches odds per
#    event across ~80 games. This is an unofficial endpoint, and polling every five
#    minutes would be ~56,000 requests a day. Getting blocked leaves you with NO data
#    rather than fresher data, which is a far worse outcome than a stale line.
# 2. Neon. One cycle writes ~612 snapshot rows plus raw bodies, against a 0.5 GB free
#    tier. Raw responses are pruned (see the prune step, shortened to 7 days to pay for
#    the denser polling below).
# 3. GitHub's scheduler. It drops most of what a dense cron asks for -- measured over
#    five days, a cron requesting ~48 runs a day delivered three to five, at arbitrary
#    minutes. Asking for more does not produce more.
#
# And the thing none of those capture: lines barely move midweek. NCAAF prices are 6%
# populated 13 days out and ~59% at six days. Polling hard on a Tuesday is watching
# nothing happen, repeatedly. The value is concentrated in the hours before kickoff.
#
# So the shape is dense inside game windows and sparse outside, rather than uniform.
# Roughly 40 cycles a day averaged, with ~100 of them on the weekend.
#
# GitHub cron is UTC and the offset matters. Central is UTC-5 in season, so the windows
# below read, in CT:
#
#   Sat 11am - 6pm    the college slate, every 15 minutes
#   Sat 7pm - midnight  night college games, every 15 minutes
#   Sun noon - 6pm    the NFL afternoon slates, every 15 minutes
#   Sun 7pm - 11pm    Sunday Night Football, every 15 minutes
#   Thu/Fri evenings  hourly, for TNF and the Friday college card
#   Mon - Thu         every three hours; there is nothing to watch
#
# Nothing runs between roughly midnight and 8am CT on any day. No games, no repricing,
# and the requests would be spent on an unchanged board.
#
# Whether GitHub actually delivers this is visible rather than assumed: the Freshness
# line on Record, Shop and Bets reports the measured median gap between real cycles and
# warns when it doubles. If the delivered cadence does not improve, that is the evidence
# to stop asking.

on:
  schedule:
    # Peak: every 15 minutes while games are actually being played.
    - cron: "*/15 16-23 * * 6"        # Sat 11am-6pm CT  -- the college slate
    - cron: "*/15 0-5 * * 0"          # Sat 7pm-midnight CT -- night college
    - cron: "*/15 17-23 * * 0"        # Sun noon-6pm CT  -- NFL afternoon
    - cron: "*/15 0-4 * * 1"          # Sun 7pm-11pm CT  -- SNF
    # Shoulders: hourly where a card exists but the board is thin.
    - cron: "0 0-4 * * 5"             # Thu 7pm-11pm CT  -- Thursday Night Football
    - cron: "0 13-23 * * 5"           # Fri 8am-6pm CT   -- weekend lines forming
    - cron: "0 0-4 * * 6"             # Fri 7pm-11pm CT  -- Friday college
    - cron: "0 13-15 * * 0"           # Sun 8am-10am CT  -- before the survivor lock
    # Midweek: three-hourly. Lines are 6% populated 13 days out.
    - cron: "0 13-22/3 * * 1,2,3,4"   # Mon-Thu 8am-5pm CT
  workflow_dispatch:                  # manual trigger, for testing

# One writer at a time. Overlapping runs would interleave inserts into the same
# append-only tables; the collector's design assumes a single writer.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the database URL is present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set. Add it in Settings > Secrets > Actions."
            exit 1
          fi

      # Each league runs separately so one league's failure cannot silently truncate
      # the other's collection. Exit code 3 means "no data" (an empty slate), which is
      # a legitimate outcome midweek and must not fail the run — only 2 (incomplete,
      # i.e. real errors occurred) should.
      - name: Collect NCAAF odds
        run: |
          python collector/odds_poller.py --league ncaaf --days 8 --postgres || \
            { code=$?; [ $code -eq 3 ] && echo "no NCAAF data this window" || exit $code; }

      - name: Collect NFL odds
        run: |
          python collector/odds_poller.py --league nfl --days 8 --postgres || \
            { code=$?; [ $code -eq 3 ] && echo "no NFL data this window" || exit $code; }

      # Cheap (one request per date) and it is what the learning loop grades against.
      # A second book, so the board has something to disagree with. ESPN returns only
      # DraftKings, and a book cannot disagree with itself -- which is why the Edges
      # page correctly reports zero.
      #
      # No cron of its own: the free tier is 500 credits a month and this workflow ticks
      # every 30 minutes in game weeks, so the module decides for itself whether a poll
      # is worth a credit (often near kickoff, rarely midweek) and backs off as the
      # budget runs down. A second schedule would be one more thing to keep in sync, and
      # Actions minutes are nearly spent.
      #
      # Skips cleanly with exit 3 when ODDS_API_KEY is unset, like the notify step.
      - name: Shop other books for a second opinion
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          for league in ncaaf nfl; do
            python collector/shop_lines.py --league $league --postgres ||               { code=$?; [ $code -eq 3 ] && echo "no shop data for $league" || exit $code; }
          done

      - name: Capture final scores
        run: |
          for league in ncaaf nfl; do
            python collector/results.py --league $league --start-date "$(date -u -d '3 days ago' +%F)" \
              --days 4 --postgres || { code=$?; [ $code -eq 3 ] || exit $code; }
          done

      - name: Detect alerts, grade settled games, refit calibration
        run: python collector/pipeline.py --postgres

      # Skipped until APP_URL and ALERT_DISPATCH_SECRET are set, so the workflow is
      # useful before the app is deployed. Never fails the run: a missed notification
      # must not look like a failed collection.
      # Survivor pick popularity. One page a week from survivorgrid.com, whose
      # robots.txt disallows nothing. Cheap, and the only input that can tell a
      # 13-person pool apart from a 137-person one: survival alone says take the
      # biggest favourite, but a pool pays the last entrant standing.
      - name: Fetch survivor pick popularity
        continue-on-error: true
        run: |
          python collector/pick_popularity.py --postgres || {
            code=$?
            [ $code -eq 3 ] && echo 'no popularity data' || exit $code
          }

      # Line-move alerts are still detected and still graded on the Track Record --
      # that is how we learn whether they predict anything. They just no longer buzz.
      # A channel that fires on every unusual line move is one you mute inside a
      # weekend, and a muted channel carries nothing when something real happens.
      # Records the line census and line-shopping picks every run. Alerts for these are
      # switched off (?notify=0) at the owner's request; the recording must keep running,
      # because the Record page and the edge calibration read it. Drop ?notify=0 to turn
      # the alerts back on.
      - name: Record line-shopping picks (alerts off)
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo "APP_URL / ALERT_DISPATCH_SECRET not set; skipping notifications."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$APP_URL/api/dispatch-shop?notify=0" \
            -H "Authorization: Bearer $DISPATCH_SECRET" \
            || echo "dispatch failed; these alerts stay pending for the next run"

      # Raw response bodies are the only table that grows dangerously against Neon's
      # 0.5 GB free tier. Snapshots, alerts and grades are small and are kept forever.
      # The bet of the day: the likeliest winner among line-shopping edges that clear
      # the house edge, at your books, never on a game you already hold, corrected by
      # how that kind of pick has graded. Replaces the FanDuel $5/$50 promotion
      # reminder, which has ended. Sent at most once a day, and only when there is a
      # bet -- a notification that arrives regardless is one you stop reading.
      - name: Bet of the day
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo 'daily bet not configured'; exit 0
          fi
          # No hour check here any more, deliberately. This used to require a run to
          # land in a two-hour Central window, and over five days of real scheduled
          # runs not one did: the cron asks for five a day midweek and ~48 at a
          # weekend, and GitHub delivers three to five, at arbitrary minutes. The
          # reminder had never fired on its own in the whole time it existed.
          #
          # The endpoint decides now, and remembers the Central date it last sent on.
          # Every run offers; the first one inside the day's window takes it. That
          # stops the reminder depending on WHEN a run happens and lets it depend
          # only on whether one happened at all.
          curl --fail --silent --show-error --max-time 60 -X POST \
            "$APP_URL/api/dispatch-daily" \
            -H "Authorization: Bearer $DISPATCH_SECRET"

      # Your team's game: the cheapest way to back them, once per game, in the 30
      # hours before kickoff. Its own step so a failure in the daily push cannot
      # stop it (bash -e ends a step at the first failed command), and the same
      # offer-every-run design: the endpoint decides, and remembers which games
      # it has already announced.
      - name: Favourite team push
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo "APP_URL / ALERT_DISPATCH_SECRET not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            "$APP_URL/api/dispatch-favourite" \
            -H "Authorization: Bearer $DISPATCH_SECRET"

      # Won, lost or pushed: one notification per ticket once its game is final. After
      # 'Capture final scores' above, so the scores it reads are this run's. Held
      # overnight and sent by the first run after 8 AM Central.
      - name: Win and loss push
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo "APP_URL / ALERT_DISPATCH_SECRET not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            "$APP_URL/api/dispatch-results" \
            -H "Authorization: Bearer $DISPATCH_SECRET"

      # Survivor reminder, Saturday evening and Sunday morning Central.
      #
      # Sent on a schedule rather than on a change, unlike every other alert here,
      # because this is a deadline you can miss rather than an opportunity that
      # appears. "Still the Chargers" is the useful message when deciding whether
      # to look again, and a change-triggered alert cannot say it. The endpoint
      # decides whether the moment qualifies and sends once per window.
      - name: Survivor pick reminder
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DISPATCH_SECRET: ${{ secrets.ALERT_DISPATCH_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo 'survivor reminders not configured'; exit 0
          fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            "$APP_URL/api/dispatch-survivor" \
            -H "Authorization: Bearer $DISPATCH_SECRET"

      # Shortened from 30 days to 7 to pay for the denser polling above. Raw bodies
      # are the only table that grows dangerously against Neon's 0.5 GB free tier, and
      # ~5x the cycles means ~5x the bodies. They exist to audit a parse that looks
      # wrong, which is a thing you do within days, not within a month.
      - name: Prune raw responses older than 7 days
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'collector')
          import psycopg
          from pg_store import prune_raw_responses
          with psycopg.connect(os.environ['DATABASE_URL']) as connection:
              print('pruned raw responses:', prune_raw_responses(connection, keep_days=7))
          "
