name: backfill

# One-off historical load, run by hand. Not scheduled: it fetches final scores plus one
# closing line per completed game, which over several seasons is tens of thousands of
# requests and has no reason to repeat once done.
#
# Sample size is the whole point. The model's uncertainty is the standard error of a
# proportion, sqrt(p(1-p)/n), so it only falls with the square root of the games behind
# it: one college season gives about +/-1.6 points, seven give about +/-0.6. Checked
# first that this is worth buying — residual dispersion is near-constant across spread
# sizes (sd ~15 college, ~12 NFL, whether the line is 1 point or 30), so the model is
# not mis-specified and more data genuinely tightens it rather than hiding a bad shape.
#
# What it buys is the margin model — the distribution of (final margin + closing
# spread) — which converts a spread into a win probability. That needs only history,
# so it is available immediately rather than after weeks of forward collection.
#
# It does NOT shorten the wait for the Track Record. Whether *our alerts* predict
# anything is a question about our own signals, and only grading them going forward
# can answer it.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Season start (YYYY-MM-DD)"
        required: true
        default: "2019-08-01"
      end:
        description: "Season end (YYYY-MM-DD)"
        required: true
        default: "2026-02-10"

concurrency:
  group: collect        # shares the collector's group; one writer at a time
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the database URL is present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set."
            exit 1
          fi

      - name: Backfill final scores
        run: |
          for league in ncaaf nfl; do
            python collector/backfill.py --league $league \
              --start "${{ inputs.start }}" --end "${{ inputs.end }}" --postgres
          done

      # One request per completed game. Slower than the scores pass, and the reason
      # this workflow has a long timeout.
      - name: Backfill closing lines
        run: python collector/backfill_lines.py --postgres --limit 30000

      - name: Fit the margin model
        run: python collector/fit_margins.py --postgres

      - name: Report what was fitted
        run: |
          python -c "
          import os, sys, json
          sys.path.insert(0, 'collector')
          import psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as c:
              rows = c.execute('SELECT league, games, mean, sd FROM margin_models ORDER BY league').fetchall()
          for league, games, mean, sd in rows:
              print(f'{league}: {games} games, residual mean {mean:+.2f}, sd {sd:.2f}')
          if not rows:
              print('No model fitted — check the score and line backfills above.')
              raise SystemExit(1)
          "
